<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10' fill='%235cc8ff'/%3E%3C/svg%3E">
<title>计算机知识体系 · 3D 交互图谱</title>
<link rel="stylesheet" href="src/styles.css">
<link rel="stylesheet" href="src/glossary.css">
</head>
<body>

<div id="graph"></div>
<svg id="stage"></svg>
<div id="atmosphere"></div>
<div id="vignette"></div>
<div id="labels"></div>

<!-- 左上：标题 · 方向 · 分层 · 掌握度 -->
<aside id="rail">
  <button id="railToggle" class="rail-toggle" type="button" title="收起左栏" aria-label="收起左栏">‹</button>
  <h1>计算机知识体系</h1>
  <p class="rail-sub"><b id="statNodes">0</b> 个节点 · <b id="statLinks">0</b> 条关系 · 按层吸附</p>

  <div class="rail-section">
    <div class="rail-title"><span>方向</span><em>选一条路</em></div>
    <div class="track-grid" id="trackGrid"></div>
  </div>

  <div class="rail-section">
    <div class="rail-title"><span>分层</span><em>点击筛选</em></div>
    <ul id="layerList"></ul>
  </div>

  <div class="rail-section">
    <div class="rail-title"><span>掌握度</span><em>点击筛选</em></div>
    <div id="statusList"></div>
    <div class="progress"><i id="progressBar"></i></div>
    <p class="progress-text" id="progressText"></p>
    <div class="progress-actions">
      <button id="exportBtn" title="把本地进度导出成 JSON">导出进度</button>
      <button id="importBtn" title="从 JSON 导入进度">导入</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <span id="progressMsg"></span>
    </div>
  </div>

  <div class="rail-foot">
    左键拖拽旋转 · 滚轮缩放<br>
    右键单击：切换左键为平移 · 右键拖拽也可平移<br>
    单击看详情 · 双击聚焦邻域<br>
    按 / 搜索并定位知识点
  </div>
</aside>

<!-- 右上：工具条 -->
<div id="dock">
  <div id="searchWrap">
    <svg class="s-icon" viewBox="0 0 16 16" fill="none" stroke="#8697b3" stroke-width="1.6">
      <circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5L14 14" stroke-linecap="round"></path>
    </svg>
    <input id="searchInput" type="text" placeholder="搜索知识点（/）" autocomplete="off" spellcheck="false" aria-label="搜索知识点">
    <div id="searchResults" role="listbox"></div>
  </div>
  <span id="matchStat">—</span>
  <label class="field only-mobile"><span>方向</span><select id="trackSelectMobile"></select></label>
  <label class="field only-mobile"><span>分层</span><select id="layerSelectMobile"></select></label>
  <label class="field"><span>布局</span><select id="layoutSelect" title="切换 3D 布局">
    <option value="helix">立体螺旋</option>
    <option value="free">自由星云</option>
    <option value="plane">分层平面</option>
  </select></label>
  <label class="field"><span>问题域</span><select id="domainSelect"></select></label>
  <button class="ghost" id="glossaryBtn" title="搜索全部节点与细分知识点">术语库</button>
  <button class="ghost" id="pathBtn">路线</button>
  <button class="ghost" id="labelBtn" aria-pressed="true">标签</button>
  <button class="ghost" id="relBtn" aria-pressed="true">关系</button>
  <button class="ghost" id="resetBtn">重置</button>
</div>

<!-- 右侧：详情面板 -->
<aside id="panel" aria-live="polite"></aside>
<button id="panelEdgeToggle" type="button" title="收起面板" aria-label="收起面板">›</button>
<button id="panelReopen" type="button" title="打开详情面板" aria-label="打开详情面板"><span>详</span><span>情</span></button>
<button id="railReopen" type="button" title="展开左栏" aria-label="展开左栏">›</button>

<div id="tooltip"></div>
<div id="focusBadge"></div>
<div id="toast"></div>

<!-- 术语库：节点 + 细分知识点统一检索 -->
<div id="glossaryOverlay" aria-hidden="true">
  <div class="glossary-backdrop" data-close></div>
  <section class="glossary-card" role="dialog" aria-modal="true" aria-label="计算机术语库">
    <header class="glossary-head">
      <div class="glossary-title">
        <b>计算机术语库</b>
        <span id="glossaryStats">155 个节点 · 1700+ 细分知识点</span>
      </div>
      <button class="glossary-close" data-close aria-label="关闭术语库">✕</button>
    </header>
    <div class="glossary-search">
      <input id="glossaryInput" type="text" placeholder="搜索术语、细分点、别名或描述（例：注解 / ci cd / 主从延迟）" autocomplete="off" spellcheck="false" aria-label="搜索术语">
    </div>
    <div class="glossary-chips" id="glossaryChips"></div>
    <div class="glossary-body">
      <div class="glossary-list" id="glossaryList"></div>
      <article class="glossary-detail" id="glossaryDetail"><div class="gempty">在左侧选择一个术语</div></article>
    </div>
  </section>
</div>

<div id="boot">
  <div class="boot-card">
    <div class="boot-spin"></div>
    <p>正在加载 3D 引擎</p>
    <small>首次打开需要联网，从 CDN 取 3d-force-graph（约 1.4 MB）</small>
  </div>
</div>

<script src="src/config.js"></script>
<script src="src/data/nodes.js"></script>
<script src="src/data/nodes-client.js"></script>
<script src="src/data/nodes-engineering.js"></script>
<script src="src/data/nodes-data-ai.js"></script>
<script src="src/data/nodes-systems.js"></script>
<script src="src/data/links.js"></script>
<script src="src/data/links-more.js"></script>
<script src="src/data/articles.js"></script>
<script src="src/data/details-os-net.js"></script>
<script src="src/data/details-backend.js"></script>
<script src="src/data/details-web.js"></script>
<script src="src/data/details-data-ai.js"></script>
<script src="src/data/details-infra-embedded.js"></script>
<script src="src/data/details-lang-arch.js"></script>
<script src="src/data/details-extra.js"></script>
<script src="src/data/paths.js"></script>
<script src="src/data/paths-more.js"></script>
<script src="src/core/util.js"></script>
<script src="src/core/store.js"></script>
<script src="src/core/progress.js"></script>
<script src="src/core/content.js"></script>
<script src="src/core/glossary.js"></script>
<script src="src/core/graph.js"></script>
<script src="src/core/actions.js"></script>
<script src="src/core/sub-model.js"></script>
<script src="src/ui/tooltip.js"></script>
<script src="src/ui/panel.js"></script>
<script src="src/ui/editor.js"></script>
<script src="src/ui/paths.js"></script>
<script src="src/ui/search.js"></script>
<script src="src/ui/labels.js"></script>
<script src="src/ui/rail.js"></script>
<script src="src/ui/two-d.js"></script>
<script src="src/ui/glossary.js"></script>
<script src="src/main.js"></script>
</body>
</html>
